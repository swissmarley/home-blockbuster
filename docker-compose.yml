# Home Blockbuster with Docker Compose, served over HTTPS.
#
#   One command:   curl -fsSL https://github.com/swissmarley/home-blockbuster/releases/latest/download/install.sh | sh
#   Or by hand:    copy .env.docker.example to .env, edit it, then   docker compose up -d
#   From source:   docker compose up -d --build
#
# A Caddy container terminates TLS on ports 80/443 and forwards to the app, which is only reachable
# inside the Compose network, so nothing between your devices and the server travels in plaintext.
#
# Every folder you want to watch must be visible inside the app container. HB_MOVIES_DIR and HB_TV_DIR
# (in .env) cover the common case; add more bind mounts, external drives or NAS shares below.
# In the app, add libraries using their path inside the container (e.g. /media/movies).

services:
  home-blockbuster:
    image: ghcr.io/swissmarley/home-blockbuster:${HB_VERSION:-latest}
    build: .
    container_name: home-blockbuster
    restart: unless-stopped
    # Not published on the host on purpose: only Caddy talks to it. To also allow plain HTTP from
    # this machine only (never expose it to the network), uncomment:
    # ports:
    #   - "127.0.0.1:8585:8585"
    expose:
      - "8585"
    environment:
      TZ: ${TZ:-UTC}
      # Optional: free TMDB key for the best artwork & metadata (https://www.themoviedb.org/settings/api)
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Optional: free OMDb key (https://www.omdbapi.com/apikey.aspx)
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      # Optional: require a password to use the app. You can also set one in the app (Settings → Security).
      HB_PASSWORD: ${HB_PASSWORD:-}
      # Caddy is one proxy hop in front: trust its X-Forwarded-* headers (client IPs, Secure cookies).
      TRUST_PROXY: "1"
      # Host names the app answers to when no password is set (your HB_DOMAIN).
      ALLOWED_HOSTS: ${HB_DOMAIN:-localhost}
    volumes:
      - ./data:/data                         # database, artwork cache, thumbnails
      # Local folders and external drives (read-only is enough, files are never modified):
      - ${HB_MOVIES_DIR:-./media/movies}:/media/movies:ro
      - ${HB_TV_DIR:-./media/tv}:/media/tv:ro
      # - /media/usb-drive:/media/usb:ro     # an external USB drive mounted on the host
      # NAS shares mounted by Docker (see "volumes" below):
      # - nas-movies:/media/nas-movies:ro
      # - nas-tv:/media/nas-tv:ro
    # Intel/AMD GPU transcoding (choose "VAAPI" in Settings → Playback). The server runs as the
    # unprivileged "node" user, so also give it the host's render group (see `getent group render`):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "109"

  caddy:
    image: caddy:2-alpine
    container_name: home-blockbuster-https
    restart: unless-stopped
    depends_on:
      home-blockbuster:
        condition: service_healthy
    ports:
      - "${HB_HTTP_PORT:-80}:${HB_HTTP_PORT:-80}"
      - "${HB_HTTPS_PORT:-443}:${HB_HTTPS_PORT:-443}"
      - "${HB_HTTPS_PORT:-443}:${HB_HTTPS_PORT:-443}/udp"   # HTTP/3
    environment:
      HB_DOMAIN: ${HB_DOMAIN:-localhost}
      HB_TLS: ${HB_TLS:-internal}
      HB_HTTP_PORT: ${HB_HTTP_PORT:-80}
      HB_HTTPS_PORT: ${HB_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro                    # your own certificate, if you use one (see Caddyfile)
      - caddy_data:/data                     # issued certificates and the local CA: keep this volume
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
